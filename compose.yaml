services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data:
